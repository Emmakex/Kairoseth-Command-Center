services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - kcc-mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { print(rs.status().ok) } catch (e) { print(rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok) }\" | grep 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: deployment/docker/api.Dockerfile
    environment:
      NODE_ENV: development
      KCC_API_HOST: 0.0.0.0
      KCC_API_PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/kairoseth_command_center?replicaSet=rs0&directConnection=true
      KCC_AUTH_MODE: ${KCC_AUTH_MODE:-disabled}
      KCC_LOCAL_ADMIN_EMAIL: ${KCC_LOCAL_ADMIN_EMAIL:-admin@kcc.local}
      KCC_LOCAL_ADMIN_PASSWORD: ${KCC_LOCAL_ADMIN_PASSWORD:-}
      KCC_LOCAL_AUTH_SECRET: ${KCC_LOCAL_AUTH_SECRET:-}
      KCC_LOCAL_ADMIN_DISPLAY_NAME: ${KCC_LOCAL_ADMIN_DISPLAY_NAME:-Local Owner}
      KCC_LOCAL_LOCALE: ${KCC_LOCAL_LOCALE:-es}
      KCC_LOCAL_TIMEZONE: ${KCC_LOCAL_TIMEZONE:-Europe/Madrid}
      KCC_LOCAL_USER_ID: ${KCC_LOCAL_USER_ID:-local-owner}
      KCC_LOCAL_WORKSPACE_ID: ${KCC_LOCAL_WORKSPACE_ID:-local-workspace}
      KCC_LOCAL_WORKSPACE_NAME: ${KCC_LOCAL_WORKSPACE_NAME:-Local Workspace}
      KCC_LOCAL_SESSION_TTL_SECONDS: ${KCC_LOCAL_SESSION_TTL_SECONDS:-43200}
      KCC_INTEGRATION_SECRET_KEY: ${KCC_INTEGRATION_SECRET_KEY:-}
      KCC_GITHUB_API_BASE_URL: ${KCC_GITHUB_API_BASE_URL:-https://api.github.com}
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: deployment/docker/worker.Dockerfile
    environment:
      NODE_ENV: development
      KCC_WORKER_POLL_MS: ${KCC_WORKER_POLL_MS:-5000}
      KCC_GITHUB_REFRESH_INTERVAL_MS: ${KCC_GITHUB_REFRESH_INTERVAL_MS:-300000}
      MONGODB_URI: mongodb://mongo:27017/kairoseth_command_center?replicaSet=rs0&directConnection=true
      KCC_INTEGRATION_SECRET_KEY: ${KCC_INTEGRATION_SECRET_KEY:-}
      KCC_GITHUB_API_BASE_URL: ${KCC_GITHUB_API_BASE_URL:-https://api.github.com}
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deployment/docker/web.Dockerfile
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      KCC_API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  kcc-mongo-data:
