name: Agent Bridge Command Delivery Acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  real-read-command-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Platform
        uses: actions/checkout@v4

      - name: Run real Agent Bridge READ command delivery
        run: bash scripts/ci/run-agent-bridge-command-delivery-acceptance.sh

      - name: Upload safe command-delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-bridge-command-delivery-evidence
          path: /tmp/agent-bridge-command-delivery-acceptance.json
          if-no-files-found: warn
          retention-days: 1

      - name: Show service state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
