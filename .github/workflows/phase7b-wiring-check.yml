name: Phase 7.2B wiring check

on:
  push:
    branches:
      - phase7/agent-bridge-write-approval

permissions:
  contents: write

jobs:
  wire-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7/agent-bridge-write-approval
          fetch-depth: 0

      - name: Apply control-plane wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          control = Path('apps/api/src/agent-bridge-control.ts')
          text = control.read_text()
          needle = "import { authorize, type AuthProvider, type SessionContext } from '@kcc/auth';\n"
          addition = needle + "import type { AgentBridgeApprovalService } from './agent-bridge-approval-service';\n"
          if "AgentBridgeApprovalService" not in text:
              text = text.replace(needle, addition, 1)
          text = text.replace(
              "    authProvider?: AuthProvider;\n    controlStore?: AgentBridgeControlStore;\n",
              "    authProvider?: AuthProvider;\n    controlStore?: AgentBridgeControlStore;\n    approvalService?: AgentBridgeApprovalService;\n",
              1,
          )
          text = text.replace(
              "        trustedApprovalKeys: [],",
              "        trustedApprovalKeys: options.approvalService\n          ? [options.approvalService.trustedKey()]\n          : [],",
              1,
          )
          control.write_text(text)

          application = Path('apps/api/src/application.ts')
          text = application.read_text()
          marker = "import type { AgentBridgeA2AStore } from './agent-bridge-a2a-store';\n"
          if "AgentBridgeApprovalService" not in text:
              text = text.replace(
                  marker,
                  marker
                  + "import type { AgentBridgeApprovalService } from './agent-bridge-approval-service';\n"
                  + "import type { AgentBridgeAuditStore } from './agent-bridge-audit-store';\n",
                  1,
              )
          security_import = "import { registerAgentBridgeSecurityRoutes } from './agent-bridge-security';\n"
          exec_import = "import type { AgentBridgeExecutionStore } from './agent-bridge-execution-store';\n"
          if security_import not in text:
              text = text.replace(exec_import, exec_import + security_import, 1)
          text = text.replace(
              "  agentBridgeExecutionStore?: AgentBridgeExecutionStore;\n",
              "  agentBridgeExecutionStore?: AgentBridgeExecutionStore;\n  agentBridgeAuditStore?: AgentBridgeAuditStore;\n  agentBridgeApprovalService?: AgentBridgeApprovalService;\n",
              1,
          )
          control_registration = """  registerAgentBridgeControlRoutes(app, {
    ...(options.authProvider ? { authProvider: options.authProvider } : {}),
    ...(options.agentBridgeControlStore
      ? { controlStore: options.agentBridgeControlStore }
      : {}),
  });"""
          replacement = """  registerAgentBridgeControlRoutes(app, {
    ...(options.authProvider ? { authProvider: options.authProvider } : {}),
    ...(options.agentBridgeControlStore
      ? { controlStore: options.agentBridgeControlStore }
      : {}),
    ...(options.agentBridgeApprovalService
      ? { approvalService: options.agentBridgeApprovalService }
      : {}),
  });"""
          if control_registration in text:
              text = text.replace(control_registration, replacement, 1)
          security_registration = """  registerAgentBridgeSecurityRoutes(app, {
    ...(options.agentBridgeControlStore
      ? { controlStore: options.agentBridgeControlStore }
      : {}),
    ...(options.agentBridgeAuditStore
      ? { auditStore: options.agentBridgeAuditStore }
      : {}),
    ...(options.agentBridgeApprovalService
      ? { approvalService: options.agentBridgeApprovalService }
      : {}),
  });
"""
          anchor = "  registerAgentBridgeRuntimeObservabilityRoutes(app, {"
          if "registerAgentBridgeSecurityRoutes(app" not in text:
              text = text.replace(anchor, security_registration + anchor, 1)
          application.write_text(text)

          acceptance = Path('.github/workflows/agent-bridge-command-delivery-acceptance.yml')
          text = acceptance.read_text()
          text = text.replace("assert.equal(writeAttempt.status, 409);", "assert.equal(writeAttempt.status, 503);")
          text = text.replace(
              "assert.equal(writeError.code, 'agent_bridge_read_tool_unavailable');",
              "assert.equal(writeError.code, 'agent_bridge_mutating_approval_unavailable');",
          )
          acceptance.write_text(text)
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter './packages/*' build

      - name: Typecheck API
        run: pnpm --filter @kcc/api typecheck

      - name: Run Agent Bridge API tests
        run: pnpm exec vitest run apps/api/test/agent-bridge-control.test.ts apps/api/test/agent-bridge-execution.test.ts

      - name: Commit validated wiring and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase7b-wiring-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/agent-bridge-control.ts apps/api/src/application.ts .github/workflows/agent-bridge-command-delivery-acceptance.yml .github/workflows/phase7b-wiring-check.yml
          git commit -m 'feat(agent-bridge): wire approval and audit control plane'
          git push origin HEAD:phase7/agent-bridge-write-approval
