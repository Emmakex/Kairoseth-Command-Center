name: Phase 7.2B READ-only compatibility

on:
  push:
    branches:
      - phase7/agent-bridge-write-approval

permissions:
  contents: write

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7/agent-bridge-write-approval
          fetch-depth: 0

      - name: Preserve READ-only response when approval signing is disabled
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          route = Path('apps/api/src/agent-bridge-execution.ts')
          text = route.read_text()
          old = "      if (error instanceof AgentBridgeApprovalSigningUnavailableError) {\n        return reply.code(503).send({ code: 'agent_bridge_mutating_approval_unavailable' });\n      }"
          new = "      if (error instanceof AgentBridgeApprovalSigningUnavailableError) {\n        return reply.code(409).send({ code: 'agent_bridge_read_tool_unavailable' });\n      }"
          if old not in text:
              raise SystemExit('expected mutating signer fallback not found')
          route.write_text(text.replace(old, new, 1))

          test = Path('apps/api/test/agent-bridge-execution.test.ts')
          text = test.read_text()
          text = text.replace('expect(writeAttempt.statusCode).toBe(503);', 'expect(writeAttempt.statusCode).toBe(409);', 1)
          text = text.replace("expect(writeAttempt.json()).toEqual({ code: 'agent_bridge_mutating_approval_unavailable' });", "expect(writeAttempt.json()).toEqual({ code: 'agent_bridge_read_tool_unavailable' });", 1)
          test.write_text(text)
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter './packages/*' build

      - name: Typecheck API
        run: pnpm --filter @kcc/api typecheck

      - name: Run Agent Bridge security and execution tests
        run: pnpm exec vitest run apps/api/test/agent-bridge-execution.test.ts apps/api/test/agent-bridge-security.test.ts apps/api/test/agent-bridge-approval-service.test.ts

      - name: Commit validated compatibility source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/agent-bridge-execution.ts apps/api/test/agent-bridge-execution.test.ts
          git commit -m 'fix(agent-bridge): preserve READ-only fallback without signer'
          git push origin HEAD:phase7/agent-bridge-write-approval
