name: Phase 7.2B audit redaction hardening

on:
  push:
    branches:
      - phase7/agent-bridge-write-approvals-audit

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7/agent-bridge-write-approvals-audit
          fetch-depth: 0

      - name: Apply audit redaction hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/agent-bridge-security.ts')
          text = path.read_text()

          constants = "const MAX_ID = 512;\nconst MAX_TEXT = 4096;\nconst MAX_AUDIT_EVENTS = 500;\n"
          hardened_constants = constants + "const MAX_AUDIT_MESSAGE = 512;\n\nconst SECRET_PATTERNS: readonly RegExp[] = [\n  /kab1\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+/g,\n  /kabd1\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+/g,\n  /Bearer\\s+[A-Za-z0-9._~+\\x2F-]+/gi,\n  /-----BEGIN [A-Z ]*PRIVATE KEY-----[\\s\\S]*?-----END [A-Z ]*PRIVATE KEY-----/g,\n  /\\b(api[_-]?key|access[_-]?token|refresh[_-]?token|token|password|secret|authorization)\\b\\s*[:=]\\s*[^\\s,;]+/gi,\n];\n"
          if 'SECRET_PATTERNS' not in text:
              if constants not in text:
                  raise SystemExit('security constants anchor not found')
              text = text.replace(constants, hardened_constants, 1)

          old_message = "  const message = optionalText(item.message, MAX_TEXT);\n"
          new_message = "  const message = item.message === undefined ? undefined : auditMessage(item.message);\n"
          if old_message in text:
              text = text.replace(old_message, new_message, 1)
          elif new_message not in text:
              raise SystemExit('audit message parse anchor not found')

          anchor = "function auditEvent(value: unknown): AgentBridgeAuditEvent | null {\n"
          helper = "function auditMessage(value: unknown): string | null {\n  if (typeof value !== 'string') return null;\n  let sanitized = Array.from(value, (character) => {\n    const codePoint = character.codePointAt(0) ?? 0;\n    const isAllowedWhitespace = codePoint === 0x09 || codePoint === 0x0a || codePoint === 0x0d;\n    return isAllowedWhitespace || (codePoint >= 0x20 && codePoint !== 0x7f) ? character : '';\n  }).join('');\n  for (const pattern of SECRET_PATTERNS) {\n    sanitized = sanitized.replace(pattern, (_match, secretName?: string) =>\n      typeof secretName === 'string' && secretName.length > 0\n        ? `${secretName}=[REDACTED]`\n        : '[REDACTED]',\n    );\n  }\n  return sanitized.slice(0, MAX_AUDIT_MESSAGE);\n}\n\n"
          if 'function auditMessage(' not in text:
              if anchor not in text:
                  raise SystemExit('auditEvent anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

          path.write_text(text)
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        run: pnpm --filter './packages/*' build

      - name: Lint API
        run: pnpm --filter @kcc/api lint

      - name: Typecheck API
        run: pnpm --filter @kcc/api typecheck

      - name: Test API
        run: pnpm --filter @kcc/api test

      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/api/src/agent-bridge-security.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/agent-bridge-security.ts
          git commit -m 'fix(agent-bridge): redact secrets from runtime audit messages'
          git push origin HEAD:phase7/agent-bridge-write-approvals-audit
