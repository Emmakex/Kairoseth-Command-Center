name: Phase 7 approval-key rotation wiring

on:
  push:
    branches:
      - phase7/agent-bridge-approval-key-rotation-clean

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7/agent-bridge-approval-key-rotation-clean
          fetch-depth: 0

      - name: Apply rotation wiring over hardened security routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          security = Path('apps/api/src/agent-bridge-security.ts')
          text = security.read_text()

          auth_import = "import type { FastifyInstance, FastifyRequest } from 'fastify';\n"
          auth_replacement = auth_import + "import { authorize, type AuthProvider, type SessionContext } from '@kcc/auth';\n"
          if "type AuthProvider" not in text:
              if auth_import not in text:
                  raise SystemExit('security import anchor missing')
              text = text.replace(auth_import, auth_replacement, 1)

          runtime_anchor = "async function runtimeSession(\n"
          operator_helper = "async function operatorSession(\n  request: FastifyRequest,\n  authProvider?: AuthProvider,\n): Promise<SessionContext | null> {\n  if (!authProvider) return null;\n  const authorization = request.headers.authorization;\n  const cookie = request.headers.cookie;\n  return authProvider.resolveSession({\n    ...(authorization ? { authorization } : {}),\n    ...(cookie ? { cookie } : {}),\n  });\n}\n\n"
          if "async function operatorSession(" not in text:
              if runtime_anchor not in text:
                  raise SystemExit('runtime session anchor missing')
              text = text.replace(runtime_anchor, operator_helper + runtime_anchor, 1)

          options_old = "  options: {\n    controlStore?: AgentBridgeControlStore;\n    approvalService?: AgentBridgeApprovalService;\n    auditStore?: AgentBridgeAuditStore;\n  },\n): void {\n"
          options_new = "  options: {\n    authProvider?: AuthProvider;\n    controlStore?: AgentBridgeControlStore;\n    approvalService?: AgentBridgeApprovalService;\n    auditStore?: AgentBridgeAuditStore;\n  },\n): void {\n"
          if "    authProvider?: AuthProvider;\n" not in text:
              if options_old not in text:
                  raise SystemExit('security options anchor missing')
              text = text.replace(options_old, options_new, 1)

          sync_anchor = "  app.post('/api/products/agent-bridge/approval-keys/sync', async (request, reply) => {\n"
          admin_routes = "  app.get('/v1/products/agent-bridge/approval-keys/rotation', async (request, reply) => {\n    reply.header('cache-control', 'no-store');\n    const session = await operatorSession(request, options.authProvider);\n    if (!session) return reply.code(401).send({ code: 'unauthorized' });\n    if (!session.activeWorkspaceId) return reply.code(400).send({ code: 'workspace_required' });\n    if (!authorize(session, { product: 'agent-bridge', capability: 'workspace.manage' })) {\n      return reply.code(403).send({ code: 'agent_bridge_forbidden' });\n    }\n    if (!options.approvalService) {\n      return reply.code(503).send({ code: 'agent_bridge_approval_unavailable' });\n    }\n\n    const status = await options.approvalService.rotationStatus(session.activeWorkspaceId);\n    return {\n      version: 'kcc.agent-bridge-approval-rotation.v1',\n      status,\n    };\n  });\n\n  app.post('/v1/products/agent-bridge/approval-keys/rotate', async (request, reply) => {\n    reply.header('cache-control', 'no-store');\n    const session = await operatorSession(request, options.authProvider);\n    if (!session) return reply.code(401).send({ code: 'unauthorized' });\n    if (!session.activeWorkspaceId) return reply.code(400).send({ code: 'workspace_required' });\n    if (!authorize(session, { product: 'agent-bridge', capability: 'workspace.manage' })) {\n      return reply.code(403).send({ code: 'agent_bridge_forbidden' });\n    }\n    if (!options.approvalService) {\n      return reply.code(503).send({ code: 'agent_bridge_approval_unavailable' });\n    }\n\n    const status = await options.approvalService.beginRotation(session.activeWorkspaceId);\n    return reply.code(202).send({\n      version: 'kcc.agent-bridge-approval-rotation.v1',\n      status,\n    });\n  });\n\n"
          if "/approval-keys/rotate" not in text:
              if sync_anchor not in text:
                  raise SystemExit('approval sync anchor missing')
              text = text.replace(sync_anchor, admin_routes + sync_anchor, 1)

          old_sync = "    const generation = await options.approvalService.generation(session.tenantId);\n    if (Number(currentGeneration) === generation) return reply.code(204).send();\n    return reply.code(409).send({\n      code: 'approval_key_generation_mismatch',\n      currentGeneration: generation,\n    });"
          new_sync = "    const reportedGeneration = Number(currentGeneration);\n    const platformGeneration = await options.approvalService.generation(session.tenantId);\n    if (reportedGeneration > platformGeneration) {\n      return reply.code(409).send({\n        code: 'approval_key_generation_ahead',\n        currentGeneration: platformGeneration,\n      });\n    }\n\n    try {\n      const result = await options.approvalService.syncApprovalKeys({\n        tenantId: session.tenantId,\n        installationId: session.installationId,\n        bridgeInstanceId: session.bridgeInstanceId,\n        currentGeneration: reportedGeneration,\n      });\n      if (!result.update) return reply.code(204).send();\n      return { update: result.update };\n    } catch (error) {\n      request.log.warn({ err: error }, 'Agent Bridge approval-key synchronization rejected');\n      if (error instanceof Error && error.message === 'agent_bridge_approval_generation_ahead') {\n        return reply.code(409).send({ code: 'approval_key_generation_ahead' });\n      }\n      return reply.code(409).send({ code: 'approval_key_sync_rejected' });\n    }"
          if old_sync in text:
              text = text.replace(old_sync, new_sync, 1)
          elif new_sync not in text:
              raise SystemExit('approval sync implementation shape unexpected')
          security.write_text(text)

          application = Path('apps/api/src/application.ts')
          text = application.read_text()
          old = "  registerAgentBridgeSecurityRoutes(app, {\n    ...(options.agentBridgeControlStore"
          new = "  registerAgentBridgeSecurityRoutes(app, {\n    ...(options.authProvider ? { authProvider: options.authProvider } : {}),\n    ...(options.agentBridgeControlStore"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('application security wiring anchor missing')
          application.write_text(text)

          existing_test = Path('apps/api/test/agent-bridge-security.test.ts')
          text = existing_test.read_text()
          anchor = "  async generation() {\n    return 0;\n  },\n  async signApproval() {"
          replacement = "  async generation() {\n    return 0;\n  },\n  async rotationStatus() {\n    return { generation: 0, phase: 'stable' as const, signingKeyId: 'unused', trustedKeyIds: [] };\n  },\n  async beginRotation() {\n    return { generation: 1, phase: 'overlap' as const, signingKeyId: 'unused', trustedKeyIds: [] };\n  },\n  async syncApprovalKeys() {\n    return {\n      update: null,\n      status: { generation: 0, phase: 'stable' as const, signingKeyId: 'unused', trustedKeyIds: [] },\n    };\n  },\n  async signApproval() {"
          if anchor in text:
              text = text.replace(anchor, replacement, 1)
          elif "async rotationStatus()" not in text:
              raise SystemExit('existing security test approval service anchor missing')
          text = text.replace("code: 'approval_key_generation_mismatch',", "code: 'approval_key_generation_ahead',", 1)
          existing_test.write_text(text)
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        run: pnpm --filter './packages/*' build

      - name: Lint
        run: pnpm lint

      - name: Typecheck API
        run: pnpm --filter @kcc/api typecheck

      - name: Run Agent Bridge tests
        run: pnpm exec vitest run apps/api/test/agent-bridge-security.test.ts apps/api/test/agent-bridge-approval-key-rotation.test.ts apps/api/test/agent-bridge-approved-execution.test.ts

      - name: Commit validated wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/api/src/agent-bridge-security.ts apps/api/src/application.ts apps/api/test/agent-bridge-security.test.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/agent-bridge-security.ts apps/api/src/application.ts apps/api/test/agent-bridge-security.test.ts
          git commit -m 'feat(agent-bridge): wire approval-key rotation routes'
          git push origin HEAD:phase7/agent-bridge-approval-key-rotation-clean
