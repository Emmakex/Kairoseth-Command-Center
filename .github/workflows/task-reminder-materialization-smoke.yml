name: Task reminder materialization smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  task-reminder-materialization-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start stack
        run: |
          export KCC_AUTH_MODE=local
          export KCC_LOCAL_ADMIN_EMAIL=ci-reminders@kcc.local
          export KCC_LOCAL_ADMIN_PASSWORD="ci-reminders-${GITHUB_RUN_ID}-valid"
          export KCC_LOCAL_AUTH_SECRET="$(openssl rand -hex 32)"
          {
            echo "KCC_AUTH_MODE=$KCC_AUTH_MODE"
            echo "KCC_LOCAL_ADMIN_EMAIL=$KCC_LOCAL_ADMIN_EMAIL"
            echo "KCC_LOCAL_ADMIN_PASSWORD=$KCC_LOCAL_ADMIN_PASSWORD"
            echo "KCC_LOCAL_AUTH_SECRET=$KCC_LOCAL_AUTH_SECRET"
          } >> "$GITHUB_ENV"
          docker compose up -d --build

      - name: Wait for API readiness
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:4000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api worker
          exit 1

      - name: Materialize one-time workspace reminder exactly once
        run: |
          login_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/auth/local/login \
            -H 'content-type: application/json' \
            --data "{\"email\":\"$KCC_LOCAL_ADMIN_EMAIL\",\"password\":\"$KCC_LOCAL_ADMIN_PASSWORD\"}")"
          access_token="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')"

          task_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/tasks \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data '{"scope":"workspace","title":"CI due reminder task"}')"
          task_id="$(printf '%s' "$task_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["task"]["id"])')"
          test -n "$task_id"

          reminder_at="$(date -u -d '10 seconds ago' '+%Y-%m-%dT%H:%M:%S.000Z')"
          reminder_response="$(curl --fail --silent \
            -X PUT "http://localhost:4000/v1/tasks/$task_id/reminders" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data "{\"scope\":\"workspace\",\"reminderRules\":[{\"kind\":\"at\",\"remindAt\":\"$reminder_at\"}]}")"
          test "$(printf '%s' "$reminder_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["task"]["reminderRules"][0]["remindAt"])')" = "$reminder_at"

          fingerprint="task-reminder:$task_id:$reminder_at"
          materialized=0
          for attempt in {1..30}; do
            alert_count="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.alerts.countDocuments({fingerprint:'$fingerprint','scope.kind':'workspace',status:'open',severity:'warning'}))")"
            reminder_remaining="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.tasks.countDocuments({id:'$task_id','scope.kind':'workspace','reminderRules.remindAt':'$reminder_at'}))")"
            audit_count="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.timeline_events.countDocuments({type:'alert.reminder_due','metadata.taskId':'$task_id','metadata.remindAt':'$reminder_at'}))")"
            if [ "$alert_count" = "1" ] && [ "$reminder_remaining" = "0" ] && [ "$audit_count" = "1" ]; then
              materialized=1
              break
            fi
            sleep 2
          done

          if [ "$materialized" != "1" ]; then
            docker compose logs worker api
            exit 1
          fi

          sleep 7
          test "$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
            "print(db.alerts.countDocuments({fingerprint:'$fingerprint'}))")" = "1"
          test "$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
            "print(db.timeline_events.countDocuments({type:'alert.reminder_due','metadata.taskId':'$task_id','metadata.remindAt':'$reminder_at'}))")" = "1"
          test "$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
            "print(db.tasks.countDocuments({id:'$task_id','reminderRules.remindAt':'$reminder_at'}))")" = "0"

      - name: Show service state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
