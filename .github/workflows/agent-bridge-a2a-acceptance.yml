name: Agent Bridge A2A Acceptance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clustered-shared-storage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start Platform stack
        run: |
          export KCC_AUTH_MODE=local
          export KCC_LOCAL_ADMIN_EMAIL=agent-bridge-ci@kcc.local
          export KCC_LOCAL_ADMIN_PASSWORD="agent-bridge-${GITHUB_RUN_ID}-valid"
          export KCC_LOCAL_AUTH_SECRET="$(openssl rand -hex 32)"
          {
            echo "KCC_AUTH_MODE=$KCC_AUTH_MODE"
            echo "KCC_LOCAL_ADMIN_EMAIL=$KCC_LOCAL_ADMIN_EMAIL"
            echo "KCC_LOCAL_ADMIN_PASSWORD=$KCC_LOCAL_ADMIN_PASSWORD"
            echo "KCC_LOCAL_AUTH_SECRET=$KCC_LOCAL_AUTH_SECRET"
          } >> "$GITHUB_ENV"
          docker compose up -d --build

      - name: Wait for Platform readiness
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:4000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api mongo
          exit 1

      - name: Prove one-winner clustered A2A transition
        run: |
          login_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/auth/local/login \
            -H 'content-type: application/json' \
            --data "{\"email\":\"$KCC_LOCAL_ADMIN_EMAIL\",\"password\":\"$KCC_LOCAL_ADMIN_PASSWORD\"}")"
          access_token="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')"
          session_response="$(curl --fail --silent \
            http://localhost:4000/v1/session \
            -H "authorization: Bearer $access_token")"
          workspace_id="$(printf '%s' "$session_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["activeWorkspaceId"])')"
          printf '%s' "$session_response" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert "agent-bridge" in data["productEntitlements"]'

          export WORKSPACE_ID="$workspace_id"
          export FINGERPRINT="$(printf 'a%.0s' {1..64})"
          python3 <<'PY' >/tmp/a2a-save.json
          import json, os
          scope = {
              "actor": "agent:ci-runtime",
              "tenantId": os.environ["WORKSPACE_ID"],
              "installationId": "ci-installation",
          }
          record = {
              "task": {
                  "id": "ci-shared-a2a-task",
                  "contextId": "ci-context",
                  "status": {
                      "state": "TASK_STATE_AUTH_REQUIRED",
                      "timestamp": "2026-10-16T12:00:00.000Z",
                  },
              },
              "scope": scope,
              "invocation": {
                  "toolId": "ci.write",
                  "input": {"value": 1},
                  "correlationId": "ci-correlation",
                  "actionFingerprint": os.environ["FINGERPRINT"],
                  "provenance": {"source": "ci"},
              },
          }
          print(json.dumps({"version": "kab.a2a-task-save.v1", "record": record}))
          PY

          save_response="$(curl --fail --silent \
            -X POST http://localhost:4000/api/products/agent-bridge/a2a/tasks/save \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data-binary @/tmp/a2a-save.json)"
          printf '%s' "$save_response" | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"saved": True}'

          make_claim() {
            CLAIM_ID="$1" python3 <<'PY'
          import json, os
          print(json.dumps({
              "version": "kab.a2a-task-claim.v1",
              "taskId": "ci-shared-a2a-task",
              "scope": {
                  "actor": "agent:ci-runtime",
                  "tenantId": os.environ["WORKSPACE_ID"],
                  "installationId": "ci-installation",
              },
              "expectedState": "TASK_STATE_AUTH_REQUIRED",
              "expectedActionFingerprint": os.environ["FINGERPRINT"],
              "claimId": os.environ["CLAIM_ID"],
          }))
          PY
          }

          curl --fail --silent \
            -X POST http://localhost:4000/api/products/agent-bridge/a2a/tasks/claim \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data "$(make_claim claim-runtime-a)" >/tmp/claim-a.json &
          pid_a=$!
          curl --fail --silent \
            -X POST http://localhost:4000/api/products/agent-bridge/a2a/tasks/claim \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data "$(make_claim claim-runtime-b)" >/tmp/claim-b.json &
          pid_b=$!
          wait "$pid_a"
          wait "$pid_b"

          winner_file="$(python3 <<'PY'
          import json
          paths = ['/tmp/claim-a.json', '/tmp/claim-b.json']
          winners = [path for path in paths if json.load(open(path, encoding='utf-8'))['claim'] is not None]
          assert len(winners) == 1, f'expected exactly one claim winner, got {len(winners)}'
          print(winners[0])
          PY
          )"

          python3 - "$winner_file" <<'PY' >/tmp/a2a-complete.json
          import copy, json, sys
          claim = json.load(open(sys.argv[1], encoding='utf-8'))['claim']
          record = copy.deepcopy(claim['record'])
          record['task']['status']['state'] = 'TASK_STATE_COMPLETED'
          record['task']['status']['timestamp'] = '2026-10-16T12:01:00.000Z'
          print(json.dumps({
              'version': 'kab.a2a-task-complete.v1',
              'claim': claim,
              'record': record,
          }))
          PY

          complete_response="$(curl --fail --silent \
            -X POST http://localhost:4000/api/products/agent-bridge/a2a/tasks/complete \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data-binary @/tmp/a2a-complete.json)"
          printf '%s' "$complete_response" | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"completed": True}'

          replay_response="$(curl --fail --silent \
            -X POST http://localhost:4000/api/products/agent-bridge/a2a/tasks/complete \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data-binary @/tmp/a2a-complete.json)"
          printf '%s' "$replay_response" | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"completed": False}'

          python3 <<'PY' >/tmp/a2a-get.json
          import json, os
          print(json.dumps({
              'version': 'kab.a2a-task-get.v1',
              'taskId': 'ci-shared-a2a-task',
              'scope': {
                  'actor': 'agent:ci-runtime',
                  'tenantId': os.environ['WORKSPACE_ID'],
                  'installationId': 'ci-installation',
              },
          }))
          PY
          get_response="$(curl --fail --silent \
            -X POST http://localhost:4000/api/products/agent-bridge/a2a/tasks/get \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data-binary @/tmp/a2a-get.json)"
          printf '%s' "$get_response" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["record"]["task"]["status"]["state"] == "TASK_STATE_COMPLETED"'

          mongo_result="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval "
            const doc=db.agent_bridge_a2a_tasks.findOne({taskId:'ci-shared-a2a-task'});
            print(JSON.stringify({
              count:db.agent_bridge_a2a_tasks.countDocuments({taskId:'ci-shared-a2a-task'}),
              state:doc.record.task.status.state,
              hasClaim:Object.prototype.hasOwnProperty.call(doc,'claimId')
            }));
          ")"
          printf '%s' "$mongo_result" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data == {"count":1,"state":"TASK_STATE_COMPLETED","hasClaim":False}'

      - name: Show service state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
