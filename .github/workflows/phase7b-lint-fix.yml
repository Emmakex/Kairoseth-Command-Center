name: Phase 7.2B lint cleanup

on:
  push:
    branches:
      - phase7/agent-bridge-write-approval

permissions:
  contents: write

jobs:
  lint-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7/agent-bridge-write-approval
          fetch-depth: 0

      - name: Apply idempotent lint cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          audit = Path('apps/api/src/agent-bridge-audit-store.ts')
          text = audit.read_text()
          old = "  const { receivedAt: _receivedAt, _id: _id, ...stored } = document as AgentBridgeAuditDocument & {\n    _id?: unknown;\n  };\n  return canonicalJson(stored) === canonicalJson(event);"
          new = "  const stored = Object.fromEntries(\n    Object.entries(document).filter(([key]) => key !== 'receivedAt' && key !== '_id'),\n  );\n  return canonicalJson(stored) === canonicalJson(event);"
          if old in text:
              text = text.replace(old, new, 1)
              audit.write_text(text)
          elif new not in text:
              raise SystemExit('unexpected audit store shape')

          security = Path('apps/api/src/agent-bridge-security.ts')
          text = security.read_text()
          old_bearer = "/Bearer\\s+[A-Za-z0-9._~+\\/-]+/gi,"
          new_bearer = "/Bearer\\s+[A-Za-z0-9._~+\\x2F-]+/gi,"
          if old_bearer in text:
              text = text.replace(old_bearer, new_bearer, 1)
          elif new_bearer not in text:
              raise SystemExit('unexpected bearer redaction regex')

          old_controls = "  let sanitized = value.replace(/[\\u0000-\\u0008\\u000B\\u000C\\u000E-\\u001F\\u007F]/g, '');"
          new_controls = "  let sanitized = Array.from(value, (character) => {\n    const codePoint = character.codePointAt(0) ?? 0;\n    const isAllowedWhitespace = codePoint === 0x09 || codePoint === 0x0a || codePoint === 0x0d;\n    return isAllowedWhitespace || (codePoint >= 0x20 && codePoint !== 0x7f) ? character : '';\n  }).join('');"
          if old_controls in text:
              text = text.replace(old_controls, new_controls, 1)
          elif new_controls not in text:
              raise SystemExit('unexpected control character sanitizer')
          security.write_text(text)
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Commit validated lint cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/api/src/agent-bridge-audit-store.ts apps/api/src/agent-bridge-security.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/agent-bridge-audit-store.ts apps/api/src/agent-bridge-security.ts
          git commit -m 'fix(agent-bridge): satisfy security and audit lint rules'
          git push origin HEAD:phase7/agent-bridge-write-approval
