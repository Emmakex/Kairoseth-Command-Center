name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --audit-level high

  docker-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start stack
        run: |
          export KCC_AUTH_MODE=local
          export KCC_LOCAL_ADMIN_EMAIL=ci@kcc.local
          export KCC_LOCAL_ADMIN_PASSWORD="ci-password-${GITHUB_RUN_ID}-valid"
          export KCC_LOCAL_AUTH_SECRET="$(openssl rand -hex 32)"
          {
            echo "KCC_AUTH_MODE=$KCC_AUTH_MODE"
            echo "KCC_LOCAL_ADMIN_EMAIL=$KCC_LOCAL_ADMIN_EMAIL"
            echo "KCC_LOCAL_ADMIN_PASSWORD=$KCC_LOCAL_ADMIN_PASSWORD"
            echo "KCC_LOCAL_AUTH_SECRET=$KCC_LOCAL_AUTH_SECRET"
          } >> "$GITHUB_ENV"
          docker compose up -d --build

      - name: Wait for API readiness
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:4000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api
          exit 1

      - name: Smoke test API and ES/EN web routes
        run: |
          curl --fail --silent http://localhost:4000/health
          curl --fail --silent http://localhost:4000/ready
          curl --fail --silent http://localhost:3000/es >/dev/null
          curl --fail --silent http://localhost:3000/en >/dev/null

      - name: Smoke test transactional Decision audit outbox
        run: |
          test "$(docker compose exec -T mongo mongosh --quiet --eval 'print(rs.status().ok)')" = "1"

          login_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/auth/local/login \
            -H 'content-type: application/json' \
            --data "{\"email\":\"$KCC_LOCAL_ADMIN_EMAIL\",\"password\":\"$KCC_LOCAL_ADMIN_PASSWORD\"}")"
          access_token="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')"

          decision_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/decision-lifecycle \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data '{"scope":"workspace","title":"CI transaction decision","decision":"Verify transactional audit delivery"}')"
          decision_id="$(printf '%s' "$decision_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["decision"]["id"])')"
          test -n "$decision_id"

          for attempt in {1..20}; do
            count="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.timeline_events.countDocuments({id:{\$exists:true},type:'decision.created',entityId:'$decision_id'}))")"
            if [ "$count" = "1" ]; then
              outbox_status="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
                "print(db.audit_outbox.findOne({'event.entityId':'$decision_id'}).status)")"
              test "$outbox_status" = "delivered"
              exit 0
            fi
            sleep 2
          done
          docker compose logs worker api
          exit 1

      - name: Show service state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
