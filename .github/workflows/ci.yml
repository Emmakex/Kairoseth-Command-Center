name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --audit-level high

  docker-smoke:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start stack
        run: |
          export KCC_AUTH_MODE=local
          export KCC_LOCAL_ADMIN_EMAIL=ci@kcc.local
          export KCC_LOCAL_ADMIN_PASSWORD="ci-password-${GITHUB_RUN_ID}-valid"
          export KCC_LOCAL_AUTH_SECRET="$(openssl rand -hex 32)"
          {
            echo "KCC_AUTH_MODE=$KCC_AUTH_MODE"
            echo "KCC_LOCAL_ADMIN_EMAIL=$KCC_LOCAL_ADMIN_EMAIL"
            echo "KCC_LOCAL_ADMIN_PASSWORD=$KCC_LOCAL_ADMIN_PASSWORD"
            echo "KCC_LOCAL_AUTH_SECRET=$KCC_LOCAL_AUTH_SECRET"
          } >> "$GITHUB_ENV"
          docker compose up -d --build

      - name: Wait for API readiness
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:4000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api
          exit 1

      - name: Smoke test API and ES/EN web routes
        run: |
          curl --fail --silent http://localhost:4000/health
          curl --fail --silent http://localhost:4000/ready
          curl --fail --silent http://localhost:3000/es >/dev/null
          curl --fail --silent http://localhost:3000/en >/dev/null

      - name: Smoke test workspace integration activity surface
        run: |
          login_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/auth/local/login \
            -H 'content-type: application/json' \
            --data "{\"email\":\"$KCC_LOCAL_ADMIN_EMAIL\",\"password\":\"$KCC_LOCAL_ADMIN_PASSWORD\"}")"
          access_token="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')"
          session_response="$(curl --fail --silent \
            http://localhost:4000/v1/session \
            -H "authorization: Bearer $access_token")"
          workspace_id="$(printf '%s' "$session_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["activeWorkspaceId"])')"
          test -n "$workspace_id"
          test "$workspace_id" != "None"

          docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval "
          const now='2026-10-15T14:30:00.000Z';
          db.integration_signals.updateOne(
            {workspaceId:'$workspace_id',id:'ci:integration-activity:9001'},
            {\$set:{
              id:'ci:integration-activity:9001',
              source:'github',
              type:'repository.ci',
              workspaceId:'$workspace_id',
              occurredAt:now,
              resourceId:'activity-resource',
              projectId:null,
              payload:{
                repository:'acme/activity',
                name:'Integration activity smoke',
                status:'completed',
                conclusion:'success',
                url:'https://github.example/acme/activity/actions/runs/9001'
              },
              ingestedAt:now,
              updatedAt:now
            }},
            {upsert:true}
          );
          " >/dev/null

          es_page="$(curl --fail --silent \
            'http://localhost:3000/es?scope=workspace&view=activity' \
            -H "Cookie: kcc_session=$access_token")"
          printf '%s' "$es_page" | grep -F 'Actividad de integraciones' >/dev/null
          printf '%s' "$es_page" | grep -F 'Integration activity smoke' >/dev/null
          printf '%s' "$es_page" | grep -F 'acme/activity' >/dev/null
          printf '%s' "$es_page" | grep -F 'Correcto' >/dev/null

          en_page="$(curl --fail --silent \
            'http://localhost:3000/en?scope=workspace&view=activity' \
            -H "Cookie: kcc_session=$access_token")"
          printf '%s' "$en_page" | grep -F 'Integration activity' >/dev/null
          printf '%s' "$en_page" | grep -F 'Integration activity smoke' >/dev/null
          printf '%s' "$en_page" | grep -F 'Successful' >/dev/null

          private_page="$(curl --fail --silent \
            'http://localhost:3000/es?scope=private&view=activity' \
            -H "Cookie: kcc_session=$access_token")"
          if printf '%s' "$private_page" | grep -F 'ci:integration-activity:9001' >/dev/null; then
            echo 'Workspace integration activity leaked into private view' >&2
            exit 1
          fi
          if printf '%s' "$private_page" | grep -F 'Integration activity smoke' >/dev/null; then
            echo 'Workspace integration signal content leaked into private view' >&2
            exit 1
          fi

      - name: Smoke test transactional audit outbox mutations
        run: |
          test "$(docker compose exec -T mongo mongosh --quiet --eval 'print(rs.status().ok)')" = "1"

          login_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/auth/local/login \
            -H 'content-type: application/json' \
            --data "{\"email\":\"$KCC_LOCAL_ADMIN_EMAIL\",\"password\":\"$KCC_LOCAL_ADMIN_PASSWORD\"}")"
          access_token="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')"

          decision_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/decision-lifecycle \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data '{"scope":"workspace","title":"CI transaction decision","decision":"Verify transactional audit delivery"}')"
          decision_id="$(printf '%s' "$decision_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["decision"]["id"])')"
          test -n "$decision_id"

          task_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/quick-capture \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data '{"scope":"private","kind":"task","title":"CI private quick capture","priority":90,"dueAt":"2026-12-31T12:00:00.000Z"}')"
          task_id="$(printf '%s' "$task_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["task"]["id"])')"
          test -n "$task_id"

          reminder_at='2026-12-31T09:30:00.000Z'
          reminder_response="$(curl --fail --silent \
            -X PUT "http://localhost:4000/v1/tasks/$task_id/reminders" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data "{\"scope\":\"private\",\"reminderRules\":[{\"kind\":\"at\",\"remindAt\":\"$reminder_at\"}]}")"
          test "$(printf '%s' "$reminder_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["task"]["reminderRules"][0]["remindAt"])')" = "$reminder_at"

          recurrence_response="$(curl --fail --silent \
            -X PUT "http://localhost:4000/v1/tasks/$task_id/recurrence" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data '{"scope":"private","recurrenceRule":{"kind":"interval_days","intervalDays":7}}')"
          test "$(printf '%s' "$recurrence_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["task"]["recurrenceRule"]["intervalDays"])')" = "7"

          dependency_a_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/tasks \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data '{"scope":"workspace","title":"CI dependency task A"}')"
          dependency_a_id="$(printf '%s' "$dependency_a_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["task"]["id"])')"
          test -n "$dependency_a_id"

          dependency_b_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/tasks \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data '{"scope":"workspace","title":"CI dependency task B"}')"
          dependency_b_id="$(printf '%s' "$dependency_b_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["task"]["id"])')"
          test -n "$dependency_b_id"

          dependency_response="$(curl --fail --silent \
            -X PUT "http://localhost:4000/v1/tasks/$dependency_a_id/dependencies" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data "{\"scope\":\"workspace\",\"dependencyIds\":[\"$dependency_b_id\"]}")"
          test "$(printf '%s' "$dependency_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["task"]["dependencyIds"][0])')" = "$dependency_b_id"

          for attempt in {1..20}; do
            decision_count="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.timeline_events.countDocuments({type:'decision.created',entityId:'$decision_id'}))")"
            task_count="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.timeline_events.countDocuments({type:'task.quick_captured',entityId:'$task_id','scope.kind':'private'}))")"
            reminder_count="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.timeline_events.countDocuments({type:'task.reminders_changed',entityId:'$task_id','scope.kind':'private'}))")"
            reminder_persisted="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.tasks.countDocuments({id:'$task_id','scope.kind':'private','reminderRules.remindAt':'$reminder_at'}))")"
            recurrence_count="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.timeline_events.countDocuments({type:'task.recurrence_changed',entityId:'$task_id','scope.kind':'private'}))")"
            recurrence_persisted="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.tasks.countDocuments({id:'$task_id','scope.kind':'private','recurrenceRule.kind':'interval_days','recurrenceRule.intervalDays':7}))")"
            dependency_count="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.timeline_events.countDocuments({type:'task.dependencies_changed',entityId:'$dependency_a_id'}))")"
            dependency_persisted="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.tasks.countDocuments({id:'$dependency_a_id',dependencyIds:'$dependency_b_id'}))")"
            if [ "$decision_count" = "1" ] && [ "$task_count" = "1" ] && [ "$reminder_count" = "1" ] && [ "$reminder_persisted" = "1" ] && [ "$recurrence_count" = "1" ] && [ "$recurrence_persisted" = "1" ] && [ "$dependency_count" = "1" ] && [ "$dependency_persisted" = "1" ]; then
              decision_outbox="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
                "print(db.audit_outbox.findOne({'event.entityId':'$decision_id'}).status)")"
              task_outbox="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
                "print(db.audit_outbox.findOne({'event.entityId':'$task_id'}).status)")"
              reminder_outbox="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
                "print(db.audit_outbox.findOne({'event.type':'task.reminders_changed','event.entityId':'$task_id'}).status)")"
              recurrence_outbox="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
                "print(db.audit_outbox.findOne({'event.type':'task.recurrence_changed','event.entityId':'$task_id'}).status)")"
              dependency_outbox="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
                "print(db.audit_outbox.findOne({'event.type':'task.dependencies_changed','event.entityId':'$dependency_a_id'}).status)")"
              test "$decision_outbox" = "delivered"
              test "$task_outbox" = "delivered"
              test "$reminder_outbox" = "delivered"
              test "$recurrence_outbox" = "delivered"
              test "$dependency_outbox" = "delivered"
              exit 0
            fi
            sleep 2
          done
          docker compose logs worker api
          exit 1

      - name: Show service state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
