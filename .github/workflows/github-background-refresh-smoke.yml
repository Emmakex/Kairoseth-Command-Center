name: GitHub background refresh smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  github-background-refresh-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start stack with provider mocks
        run: |
          export KCC_AUTH_MODE=local
          export KCC_LOCAL_ADMIN_EMAIL=ci-github-background@kcc.local
          export KCC_LOCAL_ADMIN_PASSWORD="ci-github-background-${GITHUB_RUN_ID}-password"
          export KCC_LOCAL_AUTH_SECRET="$(openssl rand -hex 32)"
          export KCC_INTEGRATION_SECRET_KEY="$(openssl rand -hex 32)"
          export KCC_GITHUB_MOCK_TOKEN="mock-${GITHUB_RUN_ID}-$(openssl rand -hex 16)"
          export KCC_WORKER_POLL_MS=1000
          {
            echo "KCC_AUTH_MODE=$KCC_AUTH_MODE"
            echo "KCC_LOCAL_ADMIN_EMAIL=$KCC_LOCAL_ADMIN_EMAIL"
            echo "KCC_LOCAL_ADMIN_PASSWORD=$KCC_LOCAL_ADMIN_PASSWORD"
            echo "KCC_LOCAL_AUTH_SECRET=$KCC_LOCAL_AUTH_SECRET"
            echo "KCC_INTEGRATION_SECRET_KEY=$KCC_INTEGRATION_SECRET_KEY"
            echo "KCC_GITHUB_MOCK_TOKEN=$KCC_GITHUB_MOCK_TOKEN"
            echo "KCC_WORKER_POLL_MS=$KCC_WORKER_POLL_MS"
          } >> "$GITHUB_ENV"
          docker compose \
            -f docker-compose.yml \
            -f deployment/docker/docker-compose.github-mock.yml \
            -f deployment/docker/docker-compose.github-background-mock.yml \
            up -d --build

      - name: Wait for API readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:4000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose \
            -f docker-compose.yml \
            -f deployment/docker/docker-compose.github-mock.yml \
            -f deployment/docker/docker-compose.github-background-mock.yml \
            ps
          docker compose \
            -f docker-compose.yml \
            -f deployment/docker/docker-compose.github-mock.yml \
            -f deployment/docker/docker-compose.github-background-mock.yml \
            logs api worker github-mock github-background-mock
          exit 1

      - name: Smoke background GitHub refresh
        run: |
          KCC_SMOKE_RUN_ID="$GITHUB_RUN_ID" \
            bash deployment/docker/smoke-github-background-refresh.sh

      - name: Diagnose queue completion
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f deployment/docker/docker-compose.github-mock.yml \
            -f deployment/docker/docker-compose.github-background-mock.yml \
            exec -T mongo mongosh --quiet kairoseth_command_center --eval "
          const ids=['background-smoke-${GITHUB_RUN_ID}','background-smoke-${GITHUB_RUN_ID}-repeat'];
          const docs=db.integration_sync_jobs.find({id:{\$in:ids}}).toArray();
          print(JSON.stringify(docs.map(({id,status,attempt,lastError,availableAt})=>({id,status,attempt,lastError,availableAt}))));
          if (docs.length !== 2 || docs.some((doc) => doc.status !== 'completed')) quit(2);
          "

      - name: Diagnose derived alert state
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f deployment/docker/docker-compose.github-mock.yml \
            -f deployment/docker/docker-compose.github-background-mock.yml \
            exec -T mongo mongosh --quiet kairoseth_command_center --eval "
          const fingerprint='integration-rule:repository.ci.failed.v1:github:workflow-run:701';
          const docs=db.alerts.find({fingerprint}).toArray();
          print(JSON.stringify(docs.map(({id,severity,status,scope})=>({id,severity,status,scope}))));
          if (docs.length !== 1 || docs[0].severity !== 'urgent' || docs[0].status !== 'open') quit(2);
          "

      - name: Diagnose derived alert audit state
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f deployment/docker/docker-compose.github-mock.yml \
            -f deployment/docker/docker-compose.github-background-mock.yml \
            exec -T mongo mongosh --quiet kairoseth_command_center --eval "
          const fingerprint='integration-rule:repository.ci.failed.v1:github:workflow-run:701';
          const alert=db.alerts.findOne({fingerprint});
          if (!alert) { print('alert missing'); quit(2); }
          const count=db.timeline_events.countDocuments({type:'alert.derived',entityId:alert.id,'scope.workspaceId':alert.scope.workspaceId});
          const outbox=db.audit_outbox.find({'event.type':'alert.derived','event.entityId':alert.id}).toArray();
          print(JSON.stringify({count,outbox:outbox.map(({status,attempts,lastError})=>({status,attempts,lastError}))}));
          if (count !== 1) quit(2);
          "

      - name: Show service state on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f deployment/docker/docker-compose.github-mock.yml \
            -f deployment/docker/docker-compose.github-background-mock.yml \
            ps
          docker compose \
            -f docker-compose.yml \
            -f deployment/docker/docker-compose.github-mock.yml \
            -f deployment/docker/docker-compose.github-background-mock.yml \
            logs --no-color

      - name: Stop stack
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f deployment/docker/docker-compose.github-mock.yml \
            -f deployment/docker/docker-compose.github-background-mock.yml \
            down -v
