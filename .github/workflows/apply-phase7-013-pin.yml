name: Apply Phase 7 0.1.3 Script Pin

on:
  push:
    branches:
      - phase7/stable-acceptance-0.1.3
    paths:
      - .github/workflows/apply-phase7-013-pin.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pin branch
        uses: actions/checkout@v4
        with:
          ref: phase7/stable-acceptance-0.1.3
          fetch-depth: 0

      - name: Pin stable Agent Bridge v0.1.3 in runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          script = Path('scripts/ops/run-agent-bridge-phase7-stable-acceptance.sh')
          text = script.read_text()
          replacements = {
              'BRIDGE_VERSION="0.1.2"': 'BRIDGE_VERSION="0.1.3"',
              'BRIDGE_COMMIT_SHORT="977bf165b60f"': 'BRIDGE_COMMIT_SHORT="72ffb6238bd8"',
              'BRIDGE_SHA256="b19f8d65e8d4dfe20299e339ca5b2b32b9b0b8d1ea589de8079fbe513fbfd22f"': 'BRIDGE_SHA256="c9d2bdaf053f63b4d48edb16ce48ac5f321ed5978fae9fc8e2818af23c078803"',
              "assert evidence['runtimeVersion'] == '0.1.2'": "assert evidence['runtimeVersion'] == '0.1.3'",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing script marker: {old}')
              text = text.replace(old, new, 1)
          script.write_text(text)
          PY
          bash -n scripts/ops/run-agent-bridge-phase7-stable-acceptance.sh
          ! grep -Eq '0\.1\.2|977bf165b60f|b19f8d65e8d4dfe20299e339ca5b2b32b9b0b8d1ea589de8079fbe513fbfd22f' scripts/ops/run-agent-bridge-phase7-stable-acceptance.sh

      - name: Commit runner pin
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ops/run-agent-bridge-phase7-stable-acceptance.sh
          git commit -m "test(phase7): pin stable Agent Bridge 0.1.3 runner"
          git push origin HEAD:phase7/stable-acceptance-0.1.3
