name: Apply Phase 7 0.1.3 Pin

on:
  push:
    branches:
      - phase7/stable-acceptance-0.1.3
    paths:
      - .github/workflows/apply-phase7-013-pin.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pin branch
        uses: actions/checkout@v4
        with:
          ref: phase7/stable-acceptance-0.1.3
          fetch-depth: 0

      - name: Pin stable Agent Bridge v0.1.3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script = Path('scripts/ops/run-agent-bridge-phase7-stable-acceptance.sh')
          text = script.read_text()
          replacements = {
              'BRIDGE_VERSION="0.1.2"': 'BRIDGE_VERSION="0.1.3"',
              'BRIDGE_COMMIT_SHORT="977bf165b60f"': 'BRIDGE_COMMIT_SHORT="72ffb6238bd8"',
              'BRIDGE_SHA256="b19f8d65e8d4dfe20299e339ca5b2b32b9b0b8d1ea589de8079fbe513fbfd22f"': 'BRIDGE_SHA256="c9d2bdaf053f63b4d48edb16ce48ac5f321ed5978fae9fc8e2818af23c078803"',
              "assert evidence['runtimeVersion'] == '0.1.2'": "assert evidence['runtimeVersion'] == '0.1.3'",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing script marker: {old}')
              text = text.replace(old, new, 1)
          script.write_text(text)

          workflow = Path('.github/workflows/agent-bridge-phase7-stable-acceptance.yml')
          text = workflow.read_text()
          replacements = {
              'BRIDGE_VERSION="0.1.2"': 'BRIDGE_VERSION="0.1.3"',
              'BRIDGE_COMMIT_SHORT="977bf165b60f"': 'BRIDGE_COMMIT_SHORT="72ffb6238bd8"',
              'BRIDGE_SHA256="b19f8d65e8d4dfe20299e339ca5b2b32b9b0b8d1ea589de8079fbe513fbfd22f"': 'BRIDGE_SHA256="c9d2bdaf053f63b4d48edb16ce48ac5f321ed5978fae9fc8e2818af23c078803"',
              "assert evidence['runtimeVersion'] == '0.1.2'": "assert evidence['runtimeVersion'] == '0.1.3'",
              'Run exact v0.1.2 stable acceptance': 'Run exact v0.1.3 stable acceptance',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing workflow marker: {old}')
              text = text.replace(old, new, 1)
          workflow.write_text(text)
          PY

      - name: Verify exact pin and runner syntax
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/ops/run-agent-bridge-phase7-stable-acceptance.sh'
          workflow='.github/workflows/agent-bridge-phase7-stable-acceptance.yml'
          bash -n "$script"
          grep -Fq 'BRIDGE_VERSION="0.1.3"' "$script"
          grep -Fq 'BRIDGE_COMMIT_SHORT="72ffb6238bd8"' "$script"
          grep -Fq 'BRIDGE_SHA256="c9d2bdaf053f63b4d48edb16ce48ac5f321ed5978fae9fc8e2818af23c078803"' "$script"
          grep -Fq "assert evidence['runtimeVersion'] == '0.1.3'" "$script"
          grep -Fq 'BRIDGE_VERSION="0.1.3"' "$workflow"
          grep -Fq 'BRIDGE_COMMIT_SHORT="72ffb6238bd8"' "$workflow"
          grep -Fq 'BRIDGE_SHA256="c9d2bdaf053f63b4d48edb16ce48ac5f321ed5978fae9fc8e2818af23c078803"' "$workflow"
          grep -Fq "assert evidence['runtimeVersion'] == '0.1.3'" "$workflow"
          ! grep -Eq '0\.1\.2|977bf165b60f|b19f8d65e8d4dfe20299e339ca5b2b32b9b0b8d1ea589de8079fbe513fbfd22f' "$script" "$workflow"

      - name: Commit clean pin
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-phase7-013-pin.yml
          git add scripts/ops/run-agent-bridge-phase7-stable-acceptance.sh .github/workflows/agent-bridge-phase7-stable-acceptance.yml
          git commit -m "test(phase7): pin stable Agent Bridge 0.1.3 acceptance"
          git push origin HEAD:phase7/stable-acceptance-0.1.3
