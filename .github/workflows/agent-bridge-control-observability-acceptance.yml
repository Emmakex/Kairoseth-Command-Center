name: Agent Bridge Control Observability Acceptance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime-control-observability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Platform
        uses: actions/checkout@v4

      - name: Checkout accepted Agent Bridge contract
        uses: actions/checkout@v4
        with:
          repository: Emmakex/kairoseth-agent-bridge
          ref: 7baa3674c91685c6007cc38421432624b4aa8b38
          path: agent-bridge-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-bridge-source/package-lock.json

      - name: Build Agent Bridge client
        working-directory: agent-bridge-source
        run: |
          npm ci
          npm run build

      - name: Build and start Platform stack
        run: |
          export KCC_AUTH_MODE=local
          export KCC_LOCAL_ADMIN_EMAIL=agent-bridge-control-ci@kcc.local
          export KCC_LOCAL_ADMIN_PASSWORD="agent-bridge-control-${GITHUB_RUN_ID}-valid"
          export KCC_LOCAL_AUTH_SECRET="$(openssl rand -hex 32)"
          {
            echo "KCC_AUTH_MODE=$KCC_AUTH_MODE"
            echo "KCC_LOCAL_ADMIN_EMAIL=$KCC_LOCAL_ADMIN_EMAIL"
            echo "KCC_LOCAL_ADMIN_PASSWORD=$KCC_LOCAL_ADMIN_PASSWORD"
            echo "KCC_LOCAL_AUTH_SECRET=$KCC_LOCAL_AUTH_SECRET"
          } >> "$GITHUB_ENV"
          docker compose up -d --build

      - name: Wait for Platform readiness
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:4000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api mongo
          exit 1

      - name: Issue workspace enrollment token
        run: |
          login_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/auth/local/login \
            -H 'content-type: application/json' \
            --data "{\"email\":\"$KCC_LOCAL_ADMIN_EMAIL\",\"password\":\"$KCC_LOCAL_ADMIN_PASSWORD\"}")"
          operator_access_token="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')"
          echo "::add-mask::$operator_access_token"

          session_response="$(curl --fail --silent \
            http://localhost:4000/v1/session \
            -H "authorization: Bearer $operator_access_token")"
          workspace_id="$(printf '%s' "$session_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["activeWorkspaceId"])')"
          printf '%s' "$session_response" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert "agent-bridge" in data["productEntitlements"]; assert "workspace.manage" in data["capabilities"]'

          enrollment_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/products/agent-bridge/enrollment-tokens \
            -H "authorization: Bearer $operator_access_token")"
          enrollment_token="$(printf '%s' "$enrollment_response" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["version"] == "kcc.agent-bridge-enrollment-token.v1"; print(data["token"])')"
          echo "::add-mask::$enrollment_token"

          {
            echo "OPERATOR_ACCESS_TOKEN=$operator_access_token"
            echo "WORKSPACE_ID=$workspace_id"
            echo "ENROLLMENT_TOKEN=$enrollment_token"
          } >> "$GITHUB_ENV"

      - name: Prove real Agent Bridge enrollment session heartbeat and snapshot
        run: |
          cat > agent-bridge-control-acceptance.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { BridgeIdentityManager, InMemoryBridgeIdentityStore } from './agent-bridge-source/dist/src/identity/installation-identity.js';
          import { InstallationEnrollmentClient } from './agent-bridge-source/dist/src/control-channel/enrollment.js';
          import { HttpEnrollmentTransport } from './agent-bridge-source/dist/src/control-channel/http-enrollment-transport.js';
          import { ControlSessionClient } from './agent-bridge-source/dist/src/control-channel/session.js';
          import { HttpSessionTransport } from './agent-bridge-source/dist/src/control-channel/http-session-transport.js';
          import { HttpRuntimeSnapshotTransport } from './agent-bridge-source/dist/src/control-channel/http-runtime-snapshot-transport.js';

          const baseUrl = 'http://127.0.0.1:4000';
          const runtimeVersion = '0.1.0-dev.0';
          const capabilities = ['files'];
          const identityManager = new BridgeIdentityManager(new InMemoryBridgeIdentityStore());

          const enrollmentClient = new InstallationEnrollmentClient(
            identityManager,
            new HttpEnrollmentTransport({ baseUrl, allowInsecureHttp: true }),
            {
              runtimeVersion,
              deploymentMode: 'local',
              capabilities,
            },
          );

          const binding = await enrollmentClient.enroll(process.env.ENROLLMENT_TOKEN);
          assert.equal(binding.version, 'kab.installation-binding.v1');
          assert.equal(binding.tenantId, process.env.WORKSPACE_ID);
          assert.ok(binding.installationId);
          assert.equal(binding.trustedApprovalKeys.length, 0);

          const sessionClient = new ControlSessionClient(
            identityManager,
            new HttpSessionTransport({ baseUrl, allowInsecureHttp: true }),
            { runtimeVersion, capabilities },
          );
          const controlSession = await sessionClient.open(binding);
          assert.equal(controlSession.credential.version, 'kab.session-credential.v1');
          assert.equal(controlSession.credential.tenantId, binding.tenantId);
          assert.equal(controlSession.credential.installationId, binding.installationId);
          assert.ok(controlSession.credential.accessToken);

          const heartbeatAck = await controlSession.heartbeat('ready');
          assert.equal(heartbeatAck.version, 'kab.heartbeat-ack.v1');
          assert.equal(heartbeatAck.nextHeartbeatInSeconds, 30);
          assert.ok(Number.isFinite(Date.parse(heartbeatAck.receivedAt)));

          const snapshot = {
            version: 'kab.runtime-snapshot.v1',
            snapshotId: 'ci-control-snapshot',
            generatedAt: new Date().toISOString(),
            connectors: [
              {
                connectorId: 'files',
                connectorInstanceId: 'ci-files',
                name: 'Files',
                version: '1.0.0',
                description: 'Root-scoped file connector',
                localizations: {
                  es: { name: 'Archivos', description: 'Conector de archivos limitado por raíz' },
                  en: { name: 'Files', description: 'Root-scoped file connector' },
                },
                capabilities: ['files'],
                tools: [
                  {
                    toolId: 'read-file',
                    runtimeToolId: 'files.ci-files.read-file',
                    name: 'Read file',
                    description: 'Read an allowed file',
                    localizations: {
                      es: { name: 'Leer archivo', description: 'Lee un archivo permitido' },
                      en: { name: 'Read file', description: 'Read an allowed file' },
                    },
                    risk: 'READ',
                  },
                ],
              },
            ],
            health: [
              {
                connectorId: 'files',
                connectorInstanceId: 'ci-files',
                status: 'healthy',
                checkedAt: new Date().toISOString(),
                tools: [
                  {
                    toolId: 'read-file',
                    runtimeToolId: 'files.ci-files.read-file',
                    availability: 'available',
                  },
                ],
              },
            ],
          };

          const snapshotTransport = new HttpRuntimeSnapshotTransport({
            baseUrl,
            allowInsecureHttp: true,
          });
          const snapshotAck = await snapshotTransport.report(
            controlSession.credential.accessToken,
            snapshot,
          );
          assert.equal(snapshotAck.version, 'kab.runtime-snapshot-ack.v1');
          assert.equal(snapshotAck.snapshotId, snapshot.snapshotId);
          assert.ok(Number.isFinite(Date.parse(snapshotAck.receivedAt)));

          const operatorSnapshotAttempt = await fetch(`${baseUrl}/api/products/agent-bridge/runtime-snapshot`, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.OPERATOR_ACCESS_TOKEN}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({ snapshot }),
          });
          assert.equal(operatorSnapshotAttempt.status, 401);

          console.log(JSON.stringify({
            installationId: binding.installationId,
            bridgeInstanceId: binding.bridgeInstanceId,
            heartbeatReceivedAt: heartbeatAck.receivedAt,
            snapshotReceivedAt: snapshotAck.receivedAt,
          }));
          NODE

          node agent-bridge-control-acceptance.mjs | tee /tmp/agent-bridge-control-acceptance.json

      - name: Verify Platform operator projection and secret-at-rest boundary
        run: |
          observability="$(curl --fail --silent \
            http://localhost:4000/v1/products/agent-bridge/runtime-observability \
            -H "authorization: Bearer $OPERATOR_ACCESS_TOKEN")"
          printf '%s' "$observability" | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          assert data["version"] == "kcc.agent-bridge-runtime-observability.v1"
          summary=data["summary"]
          assert summary["totalInstallations"] == 1
          assert summary["connectedInstallations"] == 1
          assert summary["offlineInstallations"] == 0
          row=summary["installations"][0]
          assert row["connectivity"] == "connected"
          assert row["readiness"] == "ready"
          assert row["runtimeVersion"] == "0.1.0-dev.0"
          assert row["deploymentMode"] == "local"
          assert row["connectors"] == {"total":1,"healthy":1,"degraded":0,"unhealthy":0}
          assert row["tools"] == {"total":1,"available":1,"degraded":0,"blocked":0}
          serialized=json.dumps(data)
          for forbidden in ["accessToken","publicKeyPem","keyId","privateKeyPem","ENROLLMENT_TOKEN"]:
              assert forbidden not in serialized
          '

          mongo_result="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval "
            const enrollment=db.agent_bridge_enrollment_tokens.findOne({tenantId:'$WORKSPACE_ID'});
            const installation=db.agent_bridge_installations.findOne({tenantId:'$WORKSPACE_ID'});
            const session=db.agent_bridge_runtime_sessions.findOne({tenantId:'$WORKSPACE_ID'});
            const snapshot=db.agent_bridge_runtime_snapshots.findOne({tenantId:'$WORKSPACE_ID'});
            print(JSON.stringify({
              enrollmentHasHash:typeof enrollment.tokenHash==='string' && enrollment.tokenHash.length>0,
              enrollmentHasPlain:Object.prototype.hasOwnProperty.call(enrollment,'token'),
              sessionHasHash:typeof session.tokenHash==='string' && session.tokenHash.length>0,
              sessionHasPlain:Object.prototype.hasOwnProperty.call(session,'accessToken'),
              registered:Boolean(installation && installation.installationId),
              heartbeat:Boolean(installation && installation.lastHeartbeat && installation.lastHeartbeat.readiness==='ready'),
              snapshot:Boolean(snapshot && snapshot.snapshotId==='ci-control-snapshot')
            }));
          ")"
          printf '%s' "$mongo_result" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data == {"enrollmentHasHash":True,"enrollmentHasPlain":False,"sessionHasHash":True,"sessionHasPlain":False,"registered":True,"heartbeat":True,"snapshot":True}'

      - name: Show service state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
