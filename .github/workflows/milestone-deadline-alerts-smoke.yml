name: Milestone deadline alerts smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  milestone-deadline-alerts-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start stack
        run: |
          export KCC_AUTH_MODE=local
          export KCC_LOCAL_ADMIN_EMAIL=ci-milestone-deadlines@kcc.local
          export KCC_LOCAL_ADMIN_PASSWORD="ci-milestone-deadlines-${GITHUB_RUN_ID}-valid"
          export KCC_LOCAL_AUTH_SECRET="$(openssl rand -hex 32)"
          {
            echo "KCC_AUTH_MODE=$KCC_AUTH_MODE"
            echo "KCC_LOCAL_ADMIN_EMAIL=$KCC_LOCAL_ADMIN_EMAIL"
            echo "KCC_LOCAL_ADMIN_PASSWORD=$KCC_LOCAL_ADMIN_PASSWORD"
            echo "KCC_LOCAL_AUTH_SECRET=$KCC_LOCAL_AUTH_SECRET"
          } >> "$GITHUB_ENV"
          docker compose up -d --build

      - name: Wait for API readiness
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:4000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api worker
          exit 1

      - name: Reconcile milestone deadline alert lifecycle
        run: |
          login_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/auth/local/login \
            -H 'content-type: application/json' \
            --data "{\"email\":\"$KCC_LOCAL_ADMIN_EMAIL\",\"password\":\"$KCC_LOCAL_ADMIN_PASSWORD\"}")"
          access_token="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')"

          workspace_project_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/projects \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data '{"scope":"workspace","name":"CI workspace milestone project"}')"
          workspace_project_id="$(printf '%s' "$workspace_project_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["id"])')"
          test -n "$workspace_project_id"

          workspace_milestone_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/milestones \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data "{\"scope\":\"workspace\",\"projectId\":\"$workspace_project_id\",\"title\":\"CI overdue workspace milestone\",\"weight\":1,\"dueAt\":\"2020-01-01T09:00:00.000Z\"}")"
          workspace_milestone_id="$(printf '%s' "$workspace_milestone_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["milestone"]["id"])')"
          test -n "$workspace_milestone_id"

          private_project_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/projects \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data '{"scope":"private","name":"CI private milestone project"}')"
          private_project_id="$(printf '%s' "$private_project_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["id"])')"
          test -n "$private_project_id"

          private_milestone_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/milestones \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data "{\"scope\":\"private\",\"projectId\":\"$private_project_id\",\"title\":\"CI overdue private milestone\",\"weight\":1,\"dueAt\":\"2020-01-02T09:00:00.000Z\"}")"
          private_milestone_id="$(printf '%s' "$private_milestone_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["milestone"]["id"])')"
          test -n "$private_milestone_id"

          workspace_fingerprint="milestone-deadline:$workspace_milestone_id"
          private_fingerprint="milestone-deadline:$private_milestone_id"
          workspace_alert_id=''
          materialized=0
          for attempt in {1..30}; do
            workspace_alert_id="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "const a=db.alerts.findOne({fingerprint:'$workspace_fingerprint','scope.kind':'workspace',projectId:'$workspace_project_id',status:'open',severity:'urgent'}); if(a) print(a.id)")"
            workspace_alert_count="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.alerts.countDocuments({fingerprint:'$workspace_fingerprint','scope.kind':'workspace',projectId:'$workspace_project_id',status:'open',severity:'urgent'}))")"
            private_alert_count="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.alerts.countDocuments({fingerprint:'$private_fingerprint','scope.kind':'private',projectId:'$private_project_id',status:'open',severity:'urgent'}))")"
            create_audit_count="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.timeline_events.countDocuments({type:'alert.milestone_deadline_overdue','metadata.milestoneId':{\$in:['$workspace_milestone_id','$private_milestone_id']}}))")"
            delivered_count="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.audit_outbox.countDocuments({'event.type':'alert.milestone_deadline_overdue','event.metadata.milestoneId':{\$in:['$workspace_milestone_id','$private_milestone_id']},status:'delivered'}))")"
            if [ -n "$workspace_alert_id" ] && [ "$workspace_alert_count" = "1" ] && [ "$private_alert_count" = "1" ] && [ "$create_audit_count" = "2" ] && [ "$delivered_count" = "2" ]; then
              materialized=1
              break
            fi
            sleep 2
          done

          if [ "$materialized" != "1" ]; then
            docker compose logs worker api
            exit 1
          fi

          curl --fail --silent \
            -X PATCH "http://localhost:4000/v1/milestones/$workspace_milestone_id/status" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data '{"scope":"workspace","status":"done"}' >/dev/null

          resolved=0
          for attempt in {1..30}; do
            resolved_count="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.alerts.countDocuments({id:'$workspace_alert_id',fingerprint:'$workspace_fingerprint',status:'resolved',resolvedAt:{\$type:'string'}}))")"
            resolve_audit_count="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.timeline_events.countDocuments({type:'alert.auto_resolved',source:'milestone-deadlines','metadata.milestoneId':'$workspace_milestone_id','metadata.reason':'milestone_done'}))")"
            if [ "$resolved_count" = "1" ] && [ "$resolve_audit_count" = "1" ]; then
              resolved=1
              break
            fi
            sleep 2
          done
          test "$resolved" = "1"

          curl --fail --silent \
            -X PATCH "http://localhost:4000/v1/milestones/$workspace_milestone_id/status" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data '{"scope":"workspace","status":"active"}' >/dev/null

          reopened=0
          for attempt in {1..30}; do
            reopened_count="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.alerts.countDocuments({id:'$workspace_alert_id',fingerprint:'$workspace_fingerprint',status:'open',severity:'urgent'}))")"
            reopen_audit_count="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
              "print(db.timeline_events.countDocuments({type:'alert.reopened',source:'milestone-deadlines','metadata.milestoneId':'$workspace_milestone_id','metadata.cause':'milestone_deadline_overdue'}))")"
            if [ "$reopened_count" = "1" ] && [ "$reopen_audit_count" = "1" ]; then
              reopened=1
              break
            fi
            sleep 2
          done
          test "$reopened" = "1"
          test "$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
            "print(db.alerts.countDocuments({fingerprint:'$workspace_fingerprint'}))")" = "1"

          curl --fail --silent \
            -X PATCH "http://localhost:4000/v1/alerts/$workspace_alert_id/status" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $access_token" \
            --data '{"scope":"workspace","status":"dismissed"}' >/dev/null

          sleep 7
          test "$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
            "print(db.alerts.countDocuments({id:'$workspace_alert_id',fingerprint:'$workspace_fingerprint',status:'dismissed'}))")" = "1"
          test "$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
            "print(db.timeline_events.countDocuments({type:'alert.reopened',source:'milestone-deadlines','metadata.milestoneId':'$workspace_milestone_id'}))")" = "1"
          test "$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval \
            "print(db.alerts.countDocuments({fingerprint:'$private_fingerprint','scope.kind':'private',status:'open'}))")" = "1"

      - name: Show service state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
