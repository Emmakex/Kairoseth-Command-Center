name: GitHub repository links smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  github-repository-links-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start stack
        run: |
          export KCC_AUTH_MODE=local
          export KCC_LOCAL_ADMIN_EMAIL=ci-github-links@kcc.local
          export KCC_LOCAL_ADMIN_PASSWORD="ci-github-${GITHUB_RUN_ID}-password"
          export KCC_LOCAL_AUTH_SECRET="$(openssl rand -hex 32)"
          export KCC_WORKER_POLL_MS=1000
          {
            echo "KCC_AUTH_MODE=$KCC_AUTH_MODE"
            echo "KCC_LOCAL_ADMIN_EMAIL=$KCC_LOCAL_ADMIN_EMAIL"
            echo "KCC_LOCAL_ADMIN_PASSWORD=$KCC_LOCAL_ADMIN_PASSWORD"
            echo "KCC_LOCAL_AUTH_SECRET=$KCC_LOCAL_AUTH_SECRET"
            echo "KCC_WORKER_POLL_MS=$KCC_WORKER_POLL_MS"
          } >> "$GITHUB_ENV"
          docker compose up -d --build

      - name: Wait for API readiness
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:4000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api
          exit 1

      - name: Smoke repository link lifecycle
        run: |
          KCC_SMOKE_RUN_ID="$GITHUB_RUN_ID" \
            bash deployment/docker/smoke-github-repository-links.sh

      - name: Show service state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
