name: Agent Bridge Write Approval Acceptance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  signed-mutating-command-delivery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Platform
        uses: actions/checkout@v4

      - name: Checkout accepted Agent Bridge contract
        uses: actions/checkout@v4
        with:
          repository: Emmakex/kairoseth-agent-bridge
          ref: 7baa3674c91685c6007cc38421432624b4aa8b38
          path: agent-bridge-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-bridge-source/package-lock.json

      - name: Build Agent Bridge client
        working-directory: agent-bridge-source
        run: |
          npm ci
          npm run build

      - name: Generate ephemeral approval key and start Platform
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module > /tmp/kcc-agent-bridge-approval-private.pem <<'NODE'
          import { generateKeyPairSync } from 'node:crypto';
          const { privateKey } = generateKeyPairSync('ed25519');
          process.stdout.write(privateKey.export({ format: 'pem', type: 'pkcs8' }).toString());
          NODE

          export KCC_AUTH_MODE=local
          export KCC_LOCAL_ADMIN_EMAIL=agent-bridge-write-ci@kcc.local
          export KCC_LOCAL_ADMIN_PASSWORD="agent-bridge-write-${GITHUB_RUN_ID}-valid"
          export KCC_LOCAL_AUTH_SECRET="$(openssl rand -hex 32)"
          export KCC_AGENT_BRIDGE_APPROVAL_PRIVATE_KEY_PEM="$(cat /tmp/kcc-agent-bridge-approval-private.pem)"

          {
            echo "KCC_AUTH_MODE=$KCC_AUTH_MODE"
            echo "KCC_LOCAL_ADMIN_EMAIL=$KCC_LOCAL_ADMIN_EMAIL"
            echo "KCC_LOCAL_ADMIN_PASSWORD=$KCC_LOCAL_ADMIN_PASSWORD"
            echo "KCC_LOCAL_AUTH_SECRET=$KCC_LOCAL_AUTH_SECRET"
            echo 'KCC_AGENT_BRIDGE_APPROVAL_PRIVATE_KEY_PEM<<KCC_APPROVAL_EOF'
            cat /tmp/kcc-agent-bridge-approval-private.pem
            echo 'KCC_APPROVAL_EOF'
          } >> "$GITHUB_ENV"

          docker compose up -d --build

      - name: Wait for Platform readiness
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://localhost:4000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api mongo
          exit 1

      - name: Issue workspace enrollment token
        run: |
          login_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/auth/local/login \
            -H 'content-type: application/json' \
            --data "{\"email\":\"$KCC_LOCAL_ADMIN_EMAIL\",\"password\":\"$KCC_LOCAL_ADMIN_PASSWORD\"}")"
          operator_access_token="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')"
          echo "::add-mask::$operator_access_token"

          session_response="$(curl --fail --silent \
            http://localhost:4000/v1/session \
            -H "authorization: Bearer $operator_access_token")"
          workspace_id="$(printf '%s' "$session_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["activeWorkspaceId"])')"

          enrollment_response="$(curl --fail --silent \
            -X POST http://localhost:4000/v1/products/agent-bridge/enrollment-tokens \
            -H "authorization: Bearer $operator_access_token")"
          enrollment_token="$(printf '%s' "$enrollment_response" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["version"] == "kcc.agent-bridge-enrollment-token.v1"; print(data["token"])')"
          echo "::add-mask::$enrollment_token"

          {
            echo "OPERATOR_ACCESS_TOKEN=$operator_access_token"
            echo "WORKSPACE_ID=$workspace_id"
            echo "ENROLLMENT_TOKEN=$enrollment_token"
          } >> "$GITHUB_ENV"

      - name: Prove signed WRITE and CRITICAL delivery against accepted runtime contract
        shell: bash
        run: |
          set -euo pipefail
          cat > agent-bridge-write-approval-acceptance.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { BridgeIdentityManager, InMemoryBridgeIdentityStore } from './agent-bridge-source/dist/src/identity/installation-identity.js';
          import { InstallationEnrollmentClient } from './agent-bridge-source/dist/src/control-channel/enrollment.js';
          import { HttpEnrollmentTransport } from './agent-bridge-source/dist/src/control-channel/http-enrollment-transport.js';
          import { ControlSessionClient } from './agent-bridge-source/dist/src/control-channel/session.js';
          import { HttpSessionTransport } from './agent-bridge-source/dist/src/control-channel/http-session-transport.js';
          import { HttpRuntimeSnapshotTransport } from './agent-bridge-source/dist/src/control-channel/http-runtime-snapshot-transport.js';
          import { HttpCommandTransport } from './agent-bridge-source/dist/src/control-channel/http-command-transport.js';
          import { HttpApprovalKeySetTransport } from './agent-bridge-source/dist/src/control-channel/http-approval-key-set-transport.js';
          import { HttpAuditDeliveryTransport } from './agent-bridge-source/dist/src/control-channel/http-audit-delivery-transport.js';
          import { SignedApprovalVerifier } from './agent-bridge-source/dist/src/security/approval.js';

          const baseUrl = 'http://127.0.0.1:4000';
          const runtimeVersion = '0.1.0-dev.0';
          const identityManager = new BridgeIdentityManager(new InMemoryBridgeIdentityStore());

          const enrollmentClient = new InstallationEnrollmentClient(
            identityManager,
            new HttpEnrollmentTransport({ baseUrl, allowInsecureHttp: true }),
            { runtimeVersion, deploymentMode: 'local', capabilities: ['files'] },
          );
          const binding = await enrollmentClient.enroll(process.env.ENROLLMENT_TOKEN);
          assert.equal(binding.version, 'kab.installation-binding.v1');
          assert.equal(binding.tenantId, process.env.WORKSPACE_ID);
          assert.equal(binding.trustedApprovalKeys.length, 1);
          const trustedKey = binding.trustedApprovalKeys[0];
          assert.equal(typeof trustedKey.keyId, 'string');
          assert.match(trustedKey.publicKeyPem, /BEGIN PUBLIC KEY/);

          const sessionClient = new ControlSessionClient(
            identityManager,
            new HttpSessionTransport({ baseUrl, allowInsecureHttp: true }),
            { runtimeVersion, capabilities: ['files'] },
          );
          const controlSession = await sessionClient.open(binding);
          await controlSession.heartbeat('ready');

          const snapshot = {
            version: 'kab.runtime-snapshot.v1',
            snapshotId: `ci-write-snapshot-${process.env.GITHUB_RUN_ID}`,
            generatedAt: new Date().toISOString(),
            connectors: [{
              connectorId: 'files',
              connectorInstanceId: 'ci-files',
              name: 'Files',
              version: '1.0.0',
              description: 'Signed command acceptance connector',
              capabilities: ['files'],
              tools: [
                {
                  toolId: 'write-file',
                  runtimeToolId: 'files.ci-files.write-file',
                  name: 'Write file',
                  description: 'Write an allowed file',
                  risk: 'WRITE',
                },
                {
                  toolId: 'delete-file',
                  runtimeToolId: 'files.ci-files.delete-file',
                  name: 'Delete file',
                  description: 'Delete an allowed file',
                  risk: 'CRITICAL',
                },
              ],
            }],
            health: [{
              connectorId: 'files',
              connectorInstanceId: 'ci-files',
              status: 'healthy',
              checkedAt: new Date().toISOString(),
              tools: [
                {
                  toolId: 'write-file',
                  runtimeToolId: 'files.ci-files.write-file',
                  availability: 'available',
                },
                {
                  toolId: 'delete-file',
                  runtimeToolId: 'files.ci-files.delete-file',
                  availability: 'available',
                },
              ],
            }],
          };
          const snapshotTransport = new HttpRuntimeSnapshotTransport({ baseUrl, allowInsecureHttp: true });
          await snapshotTransport.report(controlSession.credential.accessToken, snapshot);

          const keySync = new HttpApprovalKeySetTransport({ baseUrl, allowInsecureHttp: true });
          const keyUpdate = await keySync.fetchApprovalKeySet(
            controlSession.credential.accessToken,
            controlSession.credential.sessionId,
            0,
          );
          assert.equal(keyUpdate, null);

          const operatorHeaders = {
            authorization: `Bearer ${process.env.OPERATOR_ACCESS_TOKEN}`,
            'content-type': 'application/json',
          };
          const queue = async (toolId, input, correlationId) => {
            const response = await fetch(
              `${baseUrl}/v1/products/agent-bridge/installations/${binding.installationId}/commands`,
              {
                method: 'POST',
                headers: operatorHeaders,
                body: JSON.stringify({ toolId, input, correlationId }),
              },
            );
            assert.equal(response.status, 201);
            const payload = await response.json();
            assert.equal(payload.version, 'kcc.agent-bridge-command.v1');
            assert.equal(payload.command.state, 'queued');
            assert.equal(payload.command.toolId, toolId);
            assert.equal(Object.prototype.hasOwnProperty.call(payload.command, 'approvalToken'), false);
            return payload.command;
          };

          const writeInput = { path: '/safe/write.txt', content: 'approved-write' };
          const criticalInput = { path: '/safe/delete.txt' };
          const writeCorrelation = `ci-write-${process.env.GITHUB_RUN_ID}`;
          const criticalCorrelation = `ci-critical-${process.env.GITHUB_RUN_ID}`;
          const queuedWrite = await queue('files.ci-files.write-file', writeInput, writeCorrelation);
          const queuedCritical = await queue('files.ci-files.delete-file', criticalInput, criticalCorrelation);
          assert.equal(queuedWrite.risk, 'WRITE');
          assert.equal(queuedCritical.risk, 'CRITICAL');

          const commandTransport = new HttpCommandTransport({ baseUrl, allowInsecureHttp: true });
          const batch = await commandTransport.fetchCommands(
            controlSession.credential.accessToken,
            controlSession.credential.sessionId,
            10,
          );
          assert.equal(batch.commands.length, 2);

          const keyById = new Map(binding.trustedApprovalKeys.map((key) => [key.keyId, key.publicKeyPem]));
          const verifier = new SignedApprovalVerifier({
            resolvePublicKey: async (keyId) => keyById.get(keyId) ?? null,
          });

          for (const command of batch.commands) {
            assert.equal(typeof command.approvalToken, 'string');
            assert.ok(command.approvalToken.length > 0);
            const verification = await verifier.verify(command.approvalToken, {
              tenantId: command.tenantId,
              installationId: command.installationId,
              toolId: command.toolId,
              correlationId: command.correlationId,
              input: command.input,
            });
            assert.equal(verification.valid, true);
            assert.equal(verification.decision, 'ALLOW');
            assert.equal(verification.payload.actionFingerprint, command.actionFingerprint);

            const tampered = await verifier.verify(command.approvalToken, {
              tenantId: command.tenantId,
              installationId: command.installationId,
              toolId: command.toolId,
              correlationId: command.correlationId,
              input: { tampered: true },
            });
            assert.equal(tampered.valid, false);
            assert.match(tampered.reason, /fingerprint/i);

            await commandTransport.acknowledgeCommand(controlSession.credential.accessToken, {
              version: 'kab.command-ack.v1',
              commandId: command.commandId,
              deliveryAttempt: command.deliveryAttempt,
              sessionId: controlSession.credential.sessionId,
              correlationId: command.correlationId,
              status: 'executed',
              completedAt: new Date().toISOString(),
              output: { accepted: true, risk: command.toolId.includes('delete') ? 'CRITICAL' : 'WRITE' },
            });
          }

          for (const queued of [queuedWrite, queuedCritical]) {
            const statusResponse = await fetch(`${baseUrl}/v1/products/agent-bridge/commands/${queued.commandId}`, {
              headers: { authorization: `Bearer ${process.env.OPERATOR_ACCESS_TOKEN}` },
            });
            assert.equal(statusResponse.status, 200);
            const status = await statusResponse.json();
            assert.equal(status.command.state, 'completed');
            assert.equal(status.command.acknowledgement.status, 'executed');
            assert.equal(Object.prototype.hasOwnProperty.call(status.command, 'approvalToken'), false);
          }

          const auditTransport = new HttpAuditDeliveryTransport({ baseUrl, allowInsecureHttp: true });
          const now = new Date().toISOString();
          const auditBatch = {
            version: 'kab.audit-batch.v1',
            batchId: `ci-audit-${process.env.GITHUB_RUN_ID}`,
            sessionId: controlSession.credential.sessionId,
            tenantId: binding.tenantId,
            installationId: binding.installationId,
            bridgeInstanceId: binding.bridgeInstanceId,
            events: [
              {
                version: 'kab.audit-event.v1',
                eventId: `ci-audit-write-${process.env.GITHUB_RUN_ID}`,
                tenantId: binding.tenantId,
                installationId: binding.installationId,
                bridgeInstanceId: binding.bridgeInstanceId,
                type: 'EXECUTION_SUCCEEDED',
                correlationId: writeCorrelation,
                toolId: 'files.ci-files.write-file',
                actor: 'kairoseth-operator:ci',
                risk: 'WRITE',
                occurredAt: now,
                outcome: 'ALLOW',
                message: 'WRITE completed; Authorization: Bearer must-not-persist',
              },
              {
                version: 'kab.audit-event.v1',
                eventId: `ci-audit-critical-${process.env.GITHUB_RUN_ID}`,
                tenantId: binding.tenantId,
                installationId: binding.installationId,
                bridgeInstanceId: binding.bridgeInstanceId,
                type: 'EXECUTION_SUCCEEDED',
                correlationId: criticalCorrelation,
                toolId: 'files.ci-files.delete-file',
                actor: 'kairoseth-operator:ci',
                risk: 'CRITICAL',
                occurredAt: now,
                outcome: 'ALLOW',
                message: 'CRITICAL completed safely.',
              },
            ],
          };
          const auditAck = await auditTransport.sendAuditBatch(
            controlSession.credential.accessToken,
            auditBatch,
          );
          assert.equal(auditAck.version, 'kab.audit-batch-ack.v1');
          assert.equal(auditAck.batchId, auditBatch.batchId);
          assert.deepEqual(new Set(auditAck.acceptedEventIds), new Set(auditBatch.events.map((event) => event.eventId)));

          console.log(JSON.stringify({
            result: 'agent-bridge-write-critical-approval-accepted',
            installationId: binding.installationId,
            trustedApprovalKeyId: trustedKey.keyId,
            commandIds: batch.commands.map((command) => command.commandId),
            auditEventIds: auditAck.acceptedEventIds,
            tamperRejected: true,
          }));
          NODE

          node agent-bridge-write-approval-acceptance.mjs | tee /tmp/agent-bridge-write-approval-acceptance.json

      - name: Verify durable command and sanitized audit persistence
        shell: bash
        run: |
          mongo_result="$(docker compose exec -T mongo mongosh --quiet kairoseth_command_center --eval "
            const commands=db.agent_bridge_commands.find({tenantId:'$WORKSPACE_ID'}).toArray();
            const audits=db.agent_bridge_audit_events.find({tenantId:'$WORKSPACE_ID'}).toArray();
            const auditText=JSON.stringify(audits);
            print(JSON.stringify({
              commandCount:commands.length,
              completedCount:commands.filter(c=>c.state==='completed').length,
              signedCount:commands.filter(c=>typeof c.approvalToken==='string' && c.approvalToken.startsWith('kab1.')).length,
              risks:commands.map(c=>c.risk).sort(),
              hasPrivateKeyField:commands.some(c=>Object.prototype.hasOwnProperty.call(c,'privateKey') || Object.prototype.hasOwnProperty.call(c,'privateKeyPem')),
              auditCount:audits.length,
              auditRisks:audits.map(a=>a.risk).sort(),
              auditContainsBearerSecret:auditText.includes('must-not-persist'),
              auditContainsRedaction:auditText.includes('[REDACTED]')
            }));
          ")"
          printf '%s' "$mongo_result" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["commandCount"]==2; assert d["completedCount"]==2; assert d["signedCount"]==2; assert d["risks"]==["CRITICAL","WRITE"]; assert d["hasPrivateKeyField"] is False; assert d["auditCount"]==2; assert d["auditRisks"]==["CRITICAL","WRITE"]; assert d["auditContainsBearerSecret"] is False; assert d["auditContainsRedaction"] is True'

      - name: Upload safe Phase 7.2B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-bridge-write-approval-evidence
          path: /tmp/agent-bridge-write-approval-acceptance.json
          if-no-files-found: warn
          retention-days: 1

      - name: Show service state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs api mongo

      - name: Stop stack
        if: always()
        run: docker compose down -v
